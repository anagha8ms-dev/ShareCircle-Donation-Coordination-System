{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ShareCircle - Password Changed</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

         body {
                    min-height: 100vh;
                    font-family: Arial, Helvetica, sans-serif;
                    
                background:
                    linear-gradient(
                            135deg,
                            rgba(0, 105, 92, 0.35),
                            rgba(0, 137, 123, 0.30)
                    ),
                    url(/static/images/b2.png);

                background-size: cover;
                background-position: center;
                background-repeat: no-repeat;
                background-attachment: fixed;
                color: #241c18;
         }



        .login-overlay {
            position: fixed;
            inset: 0;

            background: rgba(50, 30, 22, 0.10);

            pointer-events: none;
        }

        .login-container {
            position: relative;
            z-index: 1;

            min-height: 100vh;
            width: 100%;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            padding: 30px 20px;
        }

        .brand {
            color: #050505;
            font-size: 32px;
            font-weight: bold;

            margin-bottom: 25px;

            text-shadow:
                0 3px 10px rgba(30, 15, 8, 0.45);
        }

        .login-card {
            width: 100%;
            max-width: 500px;

            padding: 42px 40px;

            background: rgba(255, 248, 240, 0.68);

            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);

            border: 1px solid rgba(255, 255, 255, 0.60);

            border-radius: 24px;

            box-shadow:
                0 25px 60px rgba(25, 12, 7, 0.30);

            text-align: center;
        }

        .login-card h1 {
            color: #100501;
            font-size: 30px;
            margin-bottom: 22px;
        }

        .subtitle {
            color: #100f0f;
            font-size: 15px;
            line-height: 1.6;

            margin-bottom: 10px;
        }

        .login-btn {
            width: 100%;

            margin-top: 25px;
            padding: 14px 20px;

            background: #704c3d;
            color: #fff8f0;

            border: none;
            border-radius: 12px;

            font-size: 15px;
            font-weight: bold;

            cursor: pointer;

            box-shadow:
                0 8px 18px rgba(55, 30, 20, 0.20);

            transition: 0.3s ease;
        }

        .login-btn:hover {
            background: #5d3d31;

            transform: translateY(-2px);

            box-shadow:
                0 12px 24px rgba(55, 30, 20, 0.28);
        }

        @media (max-width: 600px) {

            .brand {
                font-size: 27px;
            }

            .login-card {
                padding: 35px 25px;
            }

            .login-card h1 {
                font-size: 26px;
            }
        }
    </style>
</head>

<body class="login-page">

    <div class="login-overlay"></div>

    <div class="login-container">

        <div class="brand"> ShareCircle</div>

        <div class="login-card">

            <h1>Password Changed!</h1>

            <p class="subtitle">
                Your password has been successfully updated.
            </p>

            <p class="subtitle">
                You can now login using your new password.
            </p>

            <a href="{% url 'login' %}" class="login-btn"
               style="display:block; text-align:center; text-decoration:none; box-sizing:border-box;">
                Login Now
            </a>

        </div>

    </div>

</body>
</html>
