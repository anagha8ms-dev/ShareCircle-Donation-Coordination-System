{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>ShareCircle - Forgot Password</title>


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        

        body {
                    min-height: 100vh;
                    font-family: Arial, Helvetica, sans-serif;
                    
                background:
                    linear-gradient(
                            135deg,
                            rgba(0, 105, 92, 0.35),
                            rgba(0, 137, 123, 0.30)
                    ),
                    url(/static/images/b2.png);

                background-size: cover;
                background-position: center;
                background-repeat: no-repeat;
                background-attachment: fixed;
                color: #241c18;
         }


        

        .login-container {
                    width: 100%;
                    min-height: 100vh;
                    display: flex;
                    flex-direction: column;
                    align-items: center;
                    justify-content: center;
                    padding: 30px 20px;
                    box-sizing: border-box;
}


        

        .brand {

            text-align: center;

            color: #070707;

            font-size: 27px;

            font-weight: bold;

            margin-bottom: 18px;

            text-shadow:
                0 2px 8px rgba(0, 0, 0, 0.30);
        }


        

        .login-card {
                    width: 100%;
                    max-width: 500px;
                    padding: 40px;
                    box-sizing: border-box;

                    background: rgba(255, 248, 240, 0.68);
                    backdrop-filter: blur(18px);
                    -webkit-backdrop-filter: blur(18px);

                    border: 1px solid rgba(255, 255, 255, 0.60);
                    border-radius: 24px;

                    box-shadow: 0 25px 60px rgba(25, 12, 7, 0.30);

                    text-align: center;
}

       
        .login-card h1 {

            color: #0d0d0d;

            font-size: 28px;

            margin-bottom: 14px;
        }


       

        .subtitle {

            color: #0c0c0c;

            font-size: 14px;

            line-height: 1.6;

            margin-bottom: 28px;
        }


       

        .input-group {

            text-align: left;

            margin-bottom: 22px;
        }


        .input-group label {

            display: block;

            margin-bottom: 7px;

            color: #090909;

            font-size: 14px;

            font-weight: bold;
        }


        .input-group input {

            width: 100%;

            height: 46px;

            padding: 10px 14px;

            border:
                1px solid rgba(12, 12, 12, 0.35);

            border-radius: 10px;

            background:
                rgba(255, 255, 255, 0.65);

            color: #080808;

            font-size: 14px;

            outline: none;

            transition: 0.25s;
        }


        .input-group input:focus {

            background:
                rgba(255, 255, 255, 0.82);

            border-color: #765344;

            box-shadow:
                0 0 0 3px rgba(118, 83, 68, 0.12);
        }


      

        .login-btn {

            width: 100%;

            padding: 13px 20px;

            border: none;

            border-radius: 10px;

            background: #65483b;

            color: #ffffff;

            font-size: 15px;

            font-weight: bold;

            cursor: pointer;

            box-shadow:
                0 8px 18px rgba(62, 42, 34, 0.25);

            transition: 0.25s;
        }


        .login-btn:hover {

            background: #4f382e;

            transform: translateY(-2px);
        }



        .register-text {

            margin-top: 23px;

            color: #090909;

            font-size: 14px;
        }


        .register-text a {

            color: #101010;

            font-weight: bold;

            text-decoration: none;
        }


        .register-text a:hover {

            color: #070707;

            text-decoration: underline;
        }


       

        @media (max-width: 600px) {

            body {

                padding: 20px 15px;
            }


            .brand {

                font-size: 24px;
            }


            .login-card {

                padding: 32px 24px;

                border-radius: 20px;
            }


            .login-card h1 {

                font-size: 25px;
            }

        }

    </style>

</head>


<body>


    <div class="login-container">


        <div class="brand">
             ShareCircle
        </div>


        <div class="login-card">


            <h1>
                Forgot Password?
            </h1>


            <p class="subtitle">

                Enter your email address and we'll send you a link
                to reset your password.

            </p>


            <form method="POST">

                {% csrf_token %}


                <div class="input-group">

                    <label>
                        Email Address
                    </label>


                    {{ form.email }}

                </div>


                <button type="submit"
                        class="login-btn">

                    Send Reset Link

                </button>

            </form>


            <p class="register-text">

                Remember your password?

                <a href="{% url 'login' %}">
                    Back to Login
                </a>

            </p>


        </div>


    </div>


</body>

</html>
