{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShareCircle - Set New Password</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

       body {
                    min-height: 100vh;
                    font-family: Arial, Helvetica, sans-serif;
                    
                background:
                    linear-gradient(
                            135deg,
                            rgba(0, 105, 92, 0.35),
                            rgba(0, 137, 123, 0.30)
                    ),
                    url(/static/images/b2.png);

                background-size: cover;
                background-position: center;
                background-repeat: no-repeat;
                background-attachment: fixed;
                color: #241c18;
         }

        .login-overlay {
            position: fixed;
            inset: 0;

            background: rgba(50, 30, 22, 0.10);

            pointer-events: none;
        }

        .login-container {
            position: relative;
            z-index: 1;

            min-height: 100vh;
            width: 100%;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            padding: 30px 20px;
        }

        .brand {
            color: #050505;
            font-size: 32px;
            font-weight: bold;

            margin-bottom: 25px;

            text-shadow:
                0 3px 10px rgba(30, 15, 8, 0.45);
        }

        .login-card {
            width: 100%;
            max-width: 500px;

            padding: 42px 40px;

            background: rgba(255, 248, 240, 0.68);

            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);

            border: 1px solid rgba(255, 255, 255, 0.60);

            border-radius: 24px;

            box-shadow:
                0 25px 60px rgba(25, 12, 7, 0.30);

            text-align: center;
        }

        .login-card h1 {
            color: #060200;
            font-size: 30px;

            margin-bottom: 15px;
        }

        .subtitle {
            color: #0b0b0b;
            font-size: 15px;
            line-height: 1.6;

            margin-bottom: 25px;
        }

        .input-group {
            width: 100%;
            text-align: left;
        }

        .input-group p {
            margin-bottom: 18px;
        }

        .input-group label {
            display: block;

            margin-bottom: 7px;

            color: #3b241c;
            font-size: 14px;
            font-weight: bold;
        }

        .input-group input {
            width: 100%;
            padding: 13px 14px;

            background: rgba(255, 255, 255, 0.75);

            border: 1px solid rgba(91, 61, 47, 0.25);
            border-radius: 10px;

            color: #3b241c;
            font-size: 15px;

            outline: none;

            transition: 0.3s ease;
        }

        .input-group input:focus {
            border-color: #704c3d;

            box-shadow:
                0 0 0 3px rgba(112, 76, 61, 0.12);
        }

        .input-group ul {
            margin-top: 7px;
            padding-left: 18px;

            color: #704c3d;
            font-size: 12px;
            line-height: 1.5;
        }

        .input-group .errorlist {
            color: #8b3a2e;
            font-size: 13px;

            margin-bottom: 6px;
            padding-left: 18px;
        }

        .login-btn {
            width: 100%;

            margin-top: 8px;
            padding: 14px 20px;

            background: #704c3d;
            color: #fff8f0;

            border: none;
            border-radius: 12px;

            font-size: 15px;
            font-weight: bold;

            cursor: pointer;

            box-shadow:
                0 8px 18px rgba(55, 30, 20, 0.20);

            transition: 0.3s ease;
        }

        .login-btn:hover {
            background: #5d3d31;

            transform: translateY(-2px);

            box-shadow:
                0 12px 24px rgba(55, 30, 20, 0.28);
        }

        @media (max-width: 600px) {

            .brand {
                font-size: 27px;
            }

            .login-card {
                padding: 35px 25px;
            }

            .login-card h1 {
                font-size: 26px;
            }
        }
    </style>
</head>

<body class="login-page">

    <div class="login-overlay"></div>

    <div class="login-container">

        <div class="brand"> ShareCircle</div>

        <div class="login-card">

            <h1>Set New Password</h1>

            <p class="subtitle">
                Create a new secure password for your ShareCircle account.
            </p>

            <form method="POST">
                {% csrf_token %}

                <div class="input-group">
                    {{ form.as_p }}
                </div>

                <button type="submit" class="login-btn">
                    Change Password
                </button>
            </form>

        </div>

    </div>

</body>
</html>
