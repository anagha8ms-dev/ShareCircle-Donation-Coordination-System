{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ShareCircle - Login</title>


    <style>

       

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


       

        body {

            min-height: 100vh;

            margin: 0;
            padding: 0;

            background:
                linear-gradient(
                    135deg,
                    rgba(0, 105, 92, 0.35),
                    rgba(0, 137, 123, 0.30)
                ),
                url("{% static 'images/b1.jpeg' %}");

            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;

            color: #241c18;

            font-family: Arial, sans-serif;
        }


        

        .login-navbar {

            position: fixed;

            top: 0;
            left: 0;

            width: 100%;

            height: 78px;

            display: flex;
            align-items: center;

            padding: 0 55px;

            background: rgba(255, 248, 240, 0.24);

            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);

            border-bottom: 1px solid rgba(255, 255, 255, 0.35);

            box-shadow:
                0 4px 20px rgba(0, 0, 0, 0.15);

            z-index: 1000;
        }


        

        .login-logo {

            color: #070707;

            font-size: 27px;

            font-weight: bold;

            letter-spacing: 0.3px;

            text-shadow:
                0 3px 10px rgba(30, 15, 8, 0.45);
        }


       

        .login-card {

            width: 100%;

            max-width: 450px;

            padding: 42px 40px;

            margin: 120px auto 40px;

            background:
                rgba(255, 255, 255, 0.20);

            backdrop-filter: blur(15px);

            -webkit-backdrop-filter: blur(15px);

            border:
                1px solid rgba(255, 255, 255, 0.45);

            border-top:
                4px solid rgba(255, 255, 255, 0.75);

            border-radius: 24px;

            box-shadow:
                0 20px 55px rgba(0, 0, 0, 0.25);
        }


        

        .logo {

            text-align: center;

            color: #0c0101;

            font-size: 28px;

            font-weight: bold;

            margin-bottom: 28px;

            text-shadow:
                0 2px 5px rgba(0, 0, 0, 0.20);
        }


        
        h1 {

            text-align: center;

            color: #110101;

            font-size: 30px;

            margin-bottom: 8px;

            text-shadow:
                0 2px 5px rgba(0, 0, 0, 0.20);
        }


       

        .subtitle {

            text-align: center;

            color:
                rgba(15, 1, 1, 0.9);

            font-size: 14px;

            margin-bottom: 30px;
        }



        form p {

            margin-bottom: 18px;
        }



        form label {

            display: block;

            color: #110101;

            font-size: 14px;

            font-weight: bold;

            margin-bottom: 7px;

            text-shadow:
                0 1px 3px rgba(0, 0, 0, 0.20);
        }



        form input,
        form select {

            width: 100%;

            padding: 13px 14px;

            border:
                1px solid rgba(255, 255, 255, 0.55);

            border-radius: 10px;

            background:
                rgba(255, 255, 255, 0.65);

            color: #263238;

            font-size: 15px;

            outline: none;

            transition: 0.3s;
        }


       

        form input::placeholder {

            color: #607D8B;
        }



        form input:focus,
        form select:focus {

            border-color: #ffffff;

            background:
                rgba(255, 255, 255, 0.85);

            box-shadow:
                0 0 0 3px
                rgba(255, 255, 255, 0.20);
        }


        
        .errorlist {

            color: #ffebee;

            font-size: 13px;

            margin-top: 5px;

            padding-left: 18px;
        }


        

        .forgot {

            text-align: right;

            margin:
                4px 0 22px;
        }


        .forgot a {

            color: #0c0101;

            text-decoration: none;

            font-size: 14px;

            font-weight: bold;

            transition: 0.3s;
        }


        .forgot a:hover {

            color: #E0F2F1;

            text-decoration: underline;
        }


        

        .login-btn {

            width: 100%;

            padding: 14px;

            border: none;

            border-radius: 11px;

            background: #5D4037;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.3s;

            box-shadow:
                0 6px 16px
                rgba(0, 0, 0, 0.20);
        }


        .login-btn:hover {

            background: #5D4037;

            transform:
                translateY(-2px);

            box-shadow:
                0 9px 20px
                rgba(0, 0, 0, 0.25);
        }


       

        .register-text {

            text-align: center;

            color:
                rgba(20, 1, 1, 0.9);

            font-size: 14px;

            margin-top: 25px;
        }


        .register-text a {

            color: #0b0101;

            text-decoration: none;

            font-weight: bold;

            transition: 0.3s;
        }


        .register-text a:hover {

            color: #E0F2F1;

            text-decoration: underline;
        }


       

        @media (max-width: 500px) {

            .login-navbar {

                height: 70px;

                padding: 0 20px;
            }


            .login-logo {

                font-size: 22px;
            }


            .login-card {

                width:
                    calc(100% - 30px);

                padding: 35px 25px;

                margin:
                    100px auto 30px;

                border-radius: 20px;
            }


            .logo {

                font-size: 25px;
            }


            h1 {

                font-size: 26px;
            }


            .subtitle {

                font-size: 13px;
            }
        }

    </style>

</head>


<body>


   

    <nav class="login-navbar">

        <div class="login-logo">

            ShareCircle

        </div>

    </nav>



    
    <div class="login-card">


        <div class="logo">

            ShareCircle

        </div>


        <h1>

            Welcome Back!

        </h1>


        <p class="subtitle">

            Login to continue to ShareCircle

        </p>



        <form method="POST">

            {% csrf_token %}

            {{ x.as_p }}



            

            <div class="forgot">

                <a href="{% url 'password_reset' %}">

                    Forgot Password?

                </a>

            </div>



        

            <button
                type="submit"
                class="login-btn">

                Login

            </button>

        </form>



        

        <p class="register-text">

            Don't have an account?

            <a href="{% url 'register' %}">

                Create Account

            </a>

        </p>


    </div>


</body>

</html>
