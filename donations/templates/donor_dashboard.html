{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ShareCircle - Donor Dashboard</title>


    <style>

        

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


       

         body {
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            
        background:
            linear-gradient(
                    135deg,
                    rgba(0, 105, 92, 0.35),
                    rgba(0, 137, 123, 0.30)
            ),
            url(/static/images/b1.jpeg);

        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        background-attachment: fixed;
        color: #241c18;
        }


        

        .donor-overlay {
            position: fixed;

            top: 0;
            left: 0;

            width: 100%;
            height: 100%;

            background: rgba(0, 77, 70, 0.12);

            z-index: 0;

            pointer-events: none;
        }


       

        .donor-navbar {

            position: relative;

            z-index: 2;

            width: 100%;

            padding: 18px 45px;

            display: flex;

            align-items: center;

            gap: 25px;

            background: rgba(255, 255, 255, 0.16);

            backdrop-filter: blur(14px);

            -webkit-backdrop-filter: blur(14px);

            border-bottom:
                1px solid rgba(255, 255, 255, 0.30);

            box-shadow:
                0 5px 20px rgba(0, 0, 0, 0.12);
        }


        

        .logo {

            font-size: 25px;

            font-weight: bold;

            color: rgb(15, 1, 1);

            margin-right: auto;

            text-shadow:
                0 2px 5px rgba(0, 0, 0, 0.20);
        }


       

        
        .nav-logout {

            text-decoration: none;

            color: rgb(14, 1, 1);

            font-size: 14px;

            font-weight: bold;

            padding: 9px 17px;

            border-radius: 8px;

            transition: 0.3s;
        }


        
        .nav-logout:hover {

            background: rgba(255, 255, 255, 0.20);

            transform: translateY(-1px);
        }


        .nav-logout {

            border:
                1px solid rgba(255, 255, 255, 0.40);
        }


        
        .donor-content {

            position: relative;

            z-index: 1;

            min-height: calc(100vh - 75px);

            display: flex;

            justify-content: center;

            align-items: center;

            padding: 50px 20px;
        }



        .donor-card {

            width: 100%;

            max-width: 650px;

            padding: 48px 50px;

            text-align: center;

            background:
                rgba(255, 255, 255, 0.20);

            backdrop-filter: blur(16px);

            -webkit-backdrop-filter: blur(16px);

            border:
                1px solid rgba(255, 255, 255, 0.45);

            border-top:
                4px solid rgba(255, 255, 255, 0.70);

            border-radius: 28px;

            box-shadow:
                0 25px 60px rgba(0, 0, 0, 0.25);
        }


       

        .small-title {

            color: #0c0601;

            font-size: 12px;

            font-weight: bold;

            letter-spacing: 2px;

            margin-bottom: 14px;
        }


        
        .donor-card h1 {

            font-size: 38px;

            margin-bottom: 12px;

            color: #0d0300;

            text-shadow:
                0 2px 7px rgba(0, 0, 0, 0.20);
        }



        .dashboard-subtitle {

            color: rgba(8, 0, 0, 0.9);

            font-size: 15px;

            line-height: 1.6;

            margin-bottom: 30px;
        }


        

        .add-donation-btn {

            display: inline-block;

            text-decoration: none;

            background: #5d4037;

            color: white;

            padding: 14px 28px;

            border-radius: 11px;

            font-size: 16px;

            font-weight: bold;

            margin-bottom: 30px;

            box-shadow:
                0 7px 18px rgba(0, 0, 0, 0.20);

            transition: 0.3s;
        }


        .add-donation-btn:hover {

           background: #5d4037;

            transform: translateY(-3px);

            box-shadow:
                0 10px 24px rgba(0, 0, 0, 0.25);
        }


        

        .dashboard-buttons {

            display: grid;

            grid-template-columns: 1fr 1fr;

            gap: 15px;
        }


        .dashboard-btn {

            min-height: 90px;

            display: flex;

            justify-content: center;

            align-items: center;

            flex-direction: column;

            gap: 8px;

            text-decoration: none;
            

            color: white;

            font-size: 15px;

            font-weight: bold;

            background: #5d4037;

            border:
                1px solid rgba(255, 255, 255, 0.40);

            border-radius: 15px;

            backdrop-filter: blur(8px);

            -webkit-backdrop-filter: blur(8px);

            transition: 0.3s;
        }


        .dashboard-btn span {

            font-size: 25px;

        }


        .dashboard-btn:hover {

            background: #5d4037;

            transform: translateY(-4px);

            box-shadow:
                0 10px 25px rgba(0, 0, 0, 0.18);
        }


       

        @media (max-width: 600px) {

            .donor-navbar {

                padding: 16px 20px;

                gap: 8px;
            }


            .logo {

                font-size: 21px;
            }


            
            .nav-logout {

                padding: 8px 10px;

                font-size: 12px;
            }


            .donor-content {

                padding: 30px 15px;
            }


            .donor-card {

                padding: 38px 22px;

                border-radius: 22px;
            }


            .donor-card h1 {

                font-size: 30px;
            }


            .dashboard-buttons {

                grid-template-columns: 1fr;
            }

        }

    </style>

</head>


<body class="donor-page">


  

    <div class="donor-overlay"></div>


    

    <nav class="donor-navbar">


        <div class="logo">

             ShareCircle

        </div>




        <a href="{% url 'logout' %}"
           class="nav-logout">

            Logout

        </a>


    </nav>



    <main class="donor-content">


        <div class="donor-card">


            <p class="small-title">

                SHARE • CARE • CONNECT

            </p>


            <h1>

                Welcome, Donor!

            </h1>


            <p class="dashboard-subtitle">

                Make a difference by sharing what you
                no longer need.

            </p>


          

            <a href="{% url 'add_donation' %}"
               class="add-donation-btn">

                + Add Donation

            </a>



            <div class="dashboard-buttons">


                <a href="{% url 'donation_list' %}"
                   class="dashboard-btn">

                    <span>♡</span>

                    My Donations

                </a>


                <a href="{% url 'donation_requests' %}"
                   class="dashboard-btn">

                    <span>♧</span>

                    Donation Requests

                </a>


            </div>


        </div>


    </main>


</body>

</html>
